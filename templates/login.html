{% extends "base.html" %}
{% block content %}
<div class="pt-login-wrap">
    <div class="card pt-login-card">
        <div class="pt-login-head">
            <span class="pt-brand-mark">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c3.5 4.2 6 7.3 6 10.6A6 6 0 0 1 12 19a6 6 0 0 1-6-6.4C6 9.3 8.5 6.2 12 2zm0 20a1 1 0 0 1-1-1h2a1 1 0 0 1-1 1z"/></svg>
            </span>
            <h4>Auto Posto Cesar</h4>
            <p>Acesse o sistema de escalas</p>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
            <div class="mt-3 text-muted text-center">
                <small>Admin padrão: admin / admin123</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
